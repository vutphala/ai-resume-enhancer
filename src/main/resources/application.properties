spring.application.name=ai-resume-enhancer

# Private by default: loopback only. Override with SERVER_ADDRESS only behind an authenticated proxy.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# AWS Bedrock Agent (credentials come from the default AWS credential chain)
bedrock.region=${AWS_REGION:us-east-1}
bedrock.agent-alias-id=${BEDROCK_AGENT_ALIAS_ID:}
bedrock.timeout-seconds=120
bedrock.max-resume-chars=30000

# Logging: INFO globally, DEBUG for this app. Override with LOG_LEVEL_ROOT / LOG_LEVEL_APP (e.g. INFO in prod).
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.vutphala.resumeenhancer=${LOG_LEVEL_APP:DEBUG}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Spring AI Bedrock Converse (backs ChatClient)
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL_ID:deepseek.v3.2}
